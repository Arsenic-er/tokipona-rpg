schema_version: "g01.task.infrastructure.v0.1"
content_version: "chapter-01.den-bypass.1"
task_type: "infrastructure_world_predicate"
task_id: "ch01_den_bypass"
task_family_id: "ecology_and_return_flow"
chapter_flow_id: "ch01_world_literacy_prologue"
chapter_segment_id: "wetland_crisis"
region_id: "valley_prologue"
region_node_id: "valley.den_bypass"
scene_ref: "../scenes/valley-den-bypass.v0.1.yaml"
ecology_ref: "../ecology/valley-prologue.v0.1.yaml"
status: "machine_contract_ready"
implementation_boundary: "typed_ecology_projection_and_world_predicates_not_raw_ecology_interpretation"

enabled_content:
  word_ids: []

world_goal:
  evaluation: "world_state_predicates_only"
  predicate_mode: "all"
  raw_utterance_string_matching_forbidden: true
  predicates:
    - predicate_id: "den.route_open"
      expression: "den_route_open == true"
    - predicate_id: "den.route_independent_from_integrity"
      expression: "route_open_writer == non_destructive_den_route_committed"

result_modes:
  - mode_id: "closed"
    completion_valid: false
    persistence_scope: "none"
    persists_across_reload: false
    patch_record_ref: null
  - mode_id: "non_destructive_route_open"
    completion_valid: true
    persistence_scope: "region_persistent"
    persists_across_reload: true
    patch_record_ref: "patch.valley.den_route.v0.1"

solution_families:
  - solution_id: "den.wait_and_observe"
    route_kind: "non_magic"
    chapter_solution_family: "wait_and_observe"
    mainline: true
    result_mode: "non_destructive_route_open"
    required_actions: [observe_warning_telegraph, retreat_to_safe_recess, wait_for_real_escape_exit, open_old_service_latch]
    required_world_predicates: [warning_observed_without_harm, fox_back_exit_reachable, player_outside_warning_zone, den_structure_unchanged]
  - solution_id: "den.dig_upper_bypass"
    route_kind: "non_magic"
    chapter_solution_family: "dig_upper_bypass"
    mainline: true
    result_mode: "non_destructive_route_open"
    required_actions: [mark_upper_dig_line, verify_fox_clearance, dig_above_den, install_task_local_braces]
    required_world_predicates: [upper_bypass_clear, fox_back_exit_reachable, den_structure_unchanged, bypass_slump_below_limit]
  - solution_id: "den.low_force_noise"
    route_kind: "non_magic"
    chapter_solution_family: "low_force_deterrence"
    mainline: true
    result_mode: "non_destructive_route_open"
    required_actions: [stand_outside_warning_zone, strike_hollow_wood_not_animal, wait_for_fox_to_exit, open_old_service_latch]
    required_world_predicates: [deterrence_damage_zero, fox_reaches_real_escape_exit, den_structure_unchanged]
  - solution_id: "den.low_force_staff"
    route_kind: "non_magic"
    chapter_solution_family: "low_force_deterrence"
    mainline: true
    result_mode: "non_destructive_route_open"
    required_actions: [hold_staff_at_distance_marker, keep_escape_lane_open, retreat_after_warning, open_old_service_latch]
    required_world_predicates: [staff_contact_damage_zero, fox_reaches_real_escape_exit, den_structure_unchanged]

completion:
  valid_result_modes: [non_destructive_route_open]
  result_events:
    non_destructive_route_open: "non_destructive_den_route_committed"
  raw_expression_never_read_for_success: true
  set_flags: {den_route_open: true}
  forbidden_writes: [fox_den_intact]

wildlife_reward_contract:
  combat_required: false
  mandatory_kills: 0
  required_drops: 0
  language_xp: 0
  learning_evidence: 0
  expression_capacity_growth: 0
  artifact_surface_slot_growth: 0
  mp_growth: 0
  direct_currency: 0
  den_destruction_opens_route: false
  harm_never_satisfies_world_goal: true

ecology_runtime_projection:
  source_ref: "../ecology/valley-prologue.v0.1.yaml"
  projection_mode: "typed_fields_only"
  raw_document_runtime_interpretation_forbidden: true
  required_fields: [minimum_warning_telegraph_seconds, intrusion_before_defense_seconds, rabbit_defensive_damage, fox_defensive_damage, real_escape_exit, return_condition]

language_exposure: []
grammar_contacts: []
material_reactions: []

entry_guard_any: ["maintenance_access_open == true"]
exit_guard_any: ["den_route_open == true"]
material_patch_refs: [patch.valley.den_route.v0.1]

recovery:
  maximum_softlock_recovery_seconds: 60
  actions: [reopen_service_return, expose_safe_recess, move_living_fox_to_real_escape_exit, restore_task_local_braces, reset_uncommitted_upper_soil]
  preserves: [fox_life_state, fox_den_intact, committed_den_route, learning_evidence, survival_state]
  duplicate_resources_forbidden: true

golden_tests:
  - id: "den.wait_zero_combat"
    solution_id: "den.wait_and_observe"
    expect: {completion_valid: true, combat_required: false, kills: 0, drops: 0, language_xp: 0, growth: 0}
  - id: "den.dig_upper_zero_combat"
    solution_id: "den.dig_upper_bypass"
    expect: {completion_valid: true, combat_required: false, den_structure_unchanged: true}
  - id: "den.noise_low_force"
    solution_id: "den.low_force_noise"
    expect: {animal_contact_damage: 0, real_escape_exit_required: true}
  - id: "den.staff_low_force"
    solution_id: "den.low_force_staff"
    expect: {animal_contact_damage: 0, strike_required: false}
  - id: "den.destruction_not_shortcut"
    expect: {fox_den_intact: false, den_route_open: false}
