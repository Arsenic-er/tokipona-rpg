automatic_word_mastery_forbidden: true
automatic_mp_increase_forbidden: true
automatic_casting_grant_forbidden: true
automatic_usable_spell_grant_forbidden: true
allocation_modes:
  - mode_id: "settlement_priority"
    benefit_ids: [resident_water_stable, crops_stable]
    cost_ids: [wetland_decline_continues, creature_migration_pressure]
    cost_projection: {horizon: immediate, visible_effect_ids: [wetland_decline_continues, creature_migration_pressure]}
  - mode_id: "wetland_priority"
    benefit_ids: [wetland_recovery_started, creature_habitat_stable]
    cost_ids: [settlement_rationing, local_food_price_pressure]
    cost_projection: {horizon: immediate, visible_effect_ids: [settlement_rationing, local_food_price_pressure]}
  - mode_id: "road_trade_priority"
    benefit_ids: [medicine_salt_metal_route_open, external_news_route_open]
    cost_ids: [settlement_minimum_supply, wetland_minimum_supply]
    cost_projection: {horizon: immediate, visible_effect_ids: [settlement_minimum_supply, wetland_minimum_supply]}
perfect_initial_balance_forbidden: true
later_upgrade_mode: "balanced_upgrade"
scene_target_ids: [underground.gravity_plumb, underground.time_pendulum, underground.material_ledger, underground.conservation_spillway, underground.record_archive, underground.shard_synchronization_cradle, underground.three_channel_allocation_console]
completion_events:
  shard_synchronization: "forest_site_synchronized"
  allocation_commit: "forest_water_allocation_committed"
  site_lead_reveal: "forest_site_lead_revealed"
  epilogue_commit: "forest_chapter_epilogue_committed"
recovery:
  maximum_softlock_recovery_seconds: 60
  actions: [reopen_public_archive_index, restore_existing_fragment_to_cradle, discard_uncommitted_allocation_preview, expose_nonmagic_return_route]
  preserves: [learning_evidence, region_commits, artifact_inventory, survival_state]
golden_tests: []
