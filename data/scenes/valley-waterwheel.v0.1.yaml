schema_version: "g01.scene.v0.1"
content_version: "chapter-01.forest.2"
scene_id: "scene.valley.waterwheel"
region_id: "valley_prologue"
region_node_id: "valley.waterwheel"
chapter_flow_id: "ch01_world_literacy_prologue"
chapter_segment_id: "waterwheel_discovery"
status: "graybox_machine_ready"
tile_size_px: 16
size_tiles: {width: 30, height: 32}
collision_rows_top_down:
  - ".............................."
  - ".............................."
  - ".............................."
