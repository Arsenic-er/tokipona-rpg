schema_version: "g01.scene.v0.1"
content_version: "chapter-01.valley-settlement.1"
scene_id: "scene.valley.settlement"
region_id: "valley_prologue"
region_node_id: "valley.settlement"
chapter_flow_id: "ch01_world_literacy_prologue"
chapter_segment_id: "settlement_orientation"
status: "graybox_machine_ready"
tile_size_px: 16
size_tiles: {width: 40, height: 30}
collision_rows_top_down:
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
  - "........................................"
