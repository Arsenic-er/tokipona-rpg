schema_version: "g01.scene.v0.1"
content_version: "chapter-01.valley-old-mine-threshold.1"
scene_id: "scene.valley.old_mine_threshold"
region_id: "valley_prologue"
region_node_id: "valley.old_mine_threshold"
chapter_flow_id: "ch01_world_literacy_prologue"
chapter_segment_id: "return_and_safe_range"
status: "machine_contract_ready"
tile_size_px: 16
size_tiles: {width: 24, height: 20}
collision_rows_top_down:
  - "........................"
  - "........................"
  - "........................"
  - "........................"
  - "........................"
  - "........................"
  - "........................"
  - "........................"
  - "........................"
