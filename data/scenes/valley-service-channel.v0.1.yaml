schema_version: "g01.scene.v0.1"
content_version: "chapter-01.valley-service-channel.1"
scene_id: "scene.valley.service_channel"
region_id: "valley_prologue"
region_node_id: "valley.service_channel"
chapter_flow_id: "ch01_world_literacy_prologue"
chapter_segment_id: "service_channel"
status: "graybox_machine_ready"
tile_size_px: 16
size_tiles: {width: 28, height: 40}
collision_rows_top_down:
  - "............................"
