schema_version: "g01.scene.v0.1"
content_version: "chapter-01.high-cistern.1"
scene_id: "scene.valley.high_cistern"
region_id: "valley_prologue"
region_node_id: "valley.high_cistern"
chapter_flow_id: "ch01_world_literacy_prologue"
chapter_segment_id: "high_cistern"
status: "graybox_machine_ready"
tile_size_px: 16
size_tiles: {width: 30, height: 48}
